# Rotina diária automatizada.
#
# Quando alguém sobe um .xlsm novo em data/raw/ (pelo site do GitHub ou por
# commit), este fluxo valida a planilha, regera a base publicada e devolve o
# resultado ao repositório. Assim a pessoa que atualiza os dados não precisa
# ter Python instalado — só arrastar o arquivo.
#
# Se a validação encontrar ERRO de estrutura, nada é publicado: a base do
# painel continua sendo a da última execução válida e o fluxo falha, avisando.
name: Atualizar base

on:
  push:
    paths:
      - "data/raw/**"
      - "config/fontes.yml"
  workflow_dispatch:
    inputs:
      estrito:
        description: "Tratar avisos como erros"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Alarme de incêndio. `data/raw/` guarda as planilhas originais, com CNPJ
      # e e-mail; o projeto pressupõe repositório privado. Se o repositório
      # estiver público E houver planilha versionada, houve exposição de dado
      # pessoal — e o histórico do git a mantém acessível mesmo depois de
      # apagada. O fluxo para aqui e grita, para a correção ser em minutos e
      # não em meses.
      #
      # Não é prevenção: no momento em que este passo roda, o commit já
      # aconteceu. É detecção imediata. A prevenção de verdade é o repositório
      # ser privado.
      - name: Recusar planilha versionada em repositório público
        if: github.event.repository.private == false
        run: |
          if ls data/raw/*.xlsm data/raw/*.xlsx 2>/dev/null | grep -q .; then
            echo "::error::EXPOSIÇÃO DE DADO PESSOAL: há planilha em data/raw/ e este repositório é PÚBLICO."
            echo ""
            echo "As planilhas contêm CNPJ e e-mail das organizações e agora estão acessíveis"
            echo "a qualquer pessoa — inclusive pelo histórico do git, mesmo se forem apagadas."
            echo ""
            echo "O que fazer, nesta ordem:"
            echo "  1. Torne o repositório privado AGORA (Settings > Danger Zone)."
            echo "  2. Limpe o histórico com git filter-repo — apagar o arquivo não basta."
            echo "  3. Registre o incidente: pode haver dever de notificação (LGPD)."
            echo ""
            echo "Ver docs/06-governanca-e-lgpd.md."
            exit 1
          fi
          echo "::notice::Repositório público, mas sem planilha versionada. Nada exposto."

      # Este fluxo também dispara quando o contrato muda, e o contrato pode
      # mudar antes de existir qualquer planilha (é o caso da primeira semana).
      # Sem planilha não há o que publicar: isso é "nada a fazer", não falha.
      - name: Verificar se há planilha para processar
        id: fonte
        run: |
          if ls data/raw/*.xlsm > /dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nenhum .xlsm em data/raw/ — nada a publicar."
          fi

      - uses: actions/setup-python@v5
        if: steps.fonte.outputs.existe == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        if: steps.fonte.outputs.existe == 'true'
        run: pip install -r requirements.txt

      # Aqui a falha é intencional: com planilha presente, erro de estrutura
      # precisa deixar o fluxo vermelho e não publicar nada.
      - name: Processar planilha e publicar base
        if: steps.fonte.outputs.existe == 'true'
        run: python -m pipeline dados ${{ inputs.estrito && '--estrito' || '' }}

      - name: Publicar resultado no repositório
        if: steps.fonte.outputs.existe == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/published docs/03-dicionario-de-dados.md
          if git diff --staged --quiet; then
            echo "Nada mudou na base — nenhum commit necessário."
          else
            git commit -m "dados: atualiza base publicada a partir da planilha do dia"
            git push
          fi

      - name: Guardar relatório de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-validacao
          path: reports/validacao.md
          if-no-files-found: ignore
