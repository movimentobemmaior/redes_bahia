# =============================================================================
# CONTRATO DE DADOS — Painel Redes Bahia
# =============================================================================
# Este arquivo é a ÚNICA fonte de verdade sobre a estrutura da planilha.
# Dele saem: a leitura do arquivo, as validações, o dicionário de dados
# (docs/03-dicionario-de-dados.md) e os metadados publicados para o painel.
#
# Escrito a partir da planilha real de 30/07/2026 11:22
# (Credenciamento_Redes_Bahia_30072026_105430.xlsx, 13 respostas).
#
# Se a estrutura mudar, rode `make perfil`: ele lê a planilha e gera um
# rascunho deste arquivo em reports/rascunho_fontes.yml, além de um relatório
# em reports/perfil_*.md. Compare, ajuste aqui e só então rode `make dados`.
#
# Tipos aceitos: texto | inteiro | decimal | data | booleano | categoria
# Regras aceitas: unico | valores_permitidos | intervalo | nao_nulo | minimo_linhas |
#                 referencia (chave estrangeira entre datasets)
# =============================================================================

versao: 2

fonte:
  diretorio: data/raw
  # A exportação do formulário sai em .xlsx (não .xlsm).
  padrao_arquivo: "*.xlsx"
  # mais_recente = usa só o arquivo mais novo (por nome). A planilha do dia
  # representa a foto completa da base naquele dia.
  selecao: mais_recente

publicacao:
  formatos: [csv, parquet, json]
  # Colunas marcadas como sensíveis nunca saem em data/published/, que é o que
  # alimenta o painel público. Ver docs/06-governanca-e-lgpd.md.
  remover_sensiveis: true
  limite_linhas_json: 0

# Histórico: a cada execução, grava contagens agregadas em
# data/published/historico.csv. É o que permite gráficos de evolução no tempo
# mesmo com a planilha sendo sempre uma foto do momento.
historico:
  arquivo: data/published/historico.csv
  agrupar_por: [status_credenciamento, estado, representa]

datasets:

  credenciamento:
    aba: Credenciamento Redes Bahia
    descricao: >-
      Uma linha por organização que respondeu o formulário de credenciamento.
      Grão: resposta ao formulário. É o funil de elegibilidade do edital —
      cada coluna `criterio_*` é um requisito respondido pela própria
      organização, e o `status_credenciamento` é o resultado da checagem
      automática desses requisitos.
    linha_cabecalho: 1
    chave: [id]
    colunas:

      # --- Identificação da resposta -------------------------------------
      id:
        origem: "ID"
        tipo: texto
        obrigatorio: true
        descricao: Identificador da resposta no sistema de formulários.
      edital:
        origem: "Edital"
        tipo: texto
        descricao: >-
          Edital ao qual a resposta se refere. Veio inteiramente vazia na
          remessa de 30/07/2026 — declarada aqui para não sumir do painel
          quando começar a ser preenchida.
      formulario:
        origem: "Formulário"
        tipo: categoria
        descricao: Nome do formulário de origem. Hoje há só um.
      data_resposta:
        origem: "Data da Resposta"
        tipo: data
        obrigatorio: true
        descricao: >-
          Data de envio da resposta. Vem como texto no formato
          "29/07/2026 às 12:16"; o pipeline converte para data.

      # --- Quem respondeu -------------------------------------------------
      organizacao:
        origem: "Respondente"
        tipo: texto
        obrigatorio: true
        descricao: Nome da organização ou coletivo respondente.
      estado:
        origem: "Estado do respondente"
        tipo: categoria
        obrigatorio: true
        descricao: Estado declarado pela organização.
      respondente_nome:
        origem: "Usuário que respondeu"
        tipo: texto
        sensivel: true
        descricao: >-
          Nome da pessoa física que preencheu o formulário. Dado pessoal —
          não publicado.
      respondente_email:
        origem: "E-mail do usuário"
        tipo: texto
        sensivel: true
        descricao: E-mail da pessoa que preencheu. Dado pessoal — não publicado.

      # --- Resultado ------------------------------------------------------
      status_credenciamento:
        origem: "Status do credenciamento"
        tipo: categoria
        obrigatorio: true
        descricao: Resultado da checagem automática dos critérios.
      representa:
        origem: "Eu represento:"
        tipo: categoria
        obrigatorio: true
        descricao: Natureza jurídica declarada pela respondente.

      # --- Critérios de elegibilidade -------------------------------------
      # Nomes curtos aqui, pergunta completa em `origem`: o cabeçalho original
      # tem até 150 caracteres e não serve como nome de coluna no painel.
      criterio_estatuto_registrado:
        origem: "Sua organização social possui a ata de Constituição e Estatuto Social registrada em cartório?"
        tipo: booleano
        descricao: Ata de constituição e estatuto registrados em cartório.
      criterio_regularidade_credito:
        origem: "Sua organização social está regularizada nos órgãos fiscalizadores de crédito, tais como: Serasa, SPC, Receita Federal, etc?"
        tipo: booleano
        descricao: Regularidade em Serasa, SPC, Receita Federal e afins.
      criterio_dois_representantes:
        origem: "Seu coletivo tem, no mínimo, dois representantes?"
        tipo: categoria
        descricao: >-
          Coletivo com ao menos dois representantes. Não é Sim/Não: organizações
          formais respondem "Não se aplica".
      criterio_sede_bahia:
        origem: "Sua organização tem sede no estado da Bahia?"
        tipo: booleano
        descricao: Sede no estado da Bahia.
      criterio_atuacao_apenas_bahia:
        origem: "Sua organização ou coletivo atua somente no mesmo estado onde está sediada (Bahia)?"
        tipo: booleano
        descricao: Atuação restrita ao estado da sede.
      criterio_municipios_ate_200mil:
        origem: "A sua organização ou coletivo atua em municípios baianos de, no máximo, 200 mil habitantes?"
        tipo: booleano
        descricao: Atuação em municípios de até 200 mil habitantes.
      criterio_em_atividade:
        origem: "Sua organização ou coletivo está em atividade e beneficia diretamente pessoas?"
        tipo: booleano
        descricao: Em atividade, com beneficiários diretos.
      criterio_receita_acima_500mil:
        origem: "Sua organização ou coletivo teve uma receita anual de mais de 500 mil reais no ano de 2025?"
        tipo: booleano
        descricao: >-
          Receita anual acima de R$ 500 mil em 2025. Atenção ao sentido:
          "Sim" aqui é critério de EXCLUSÃO, não de aprovação.
      criterio_atuacao_minima_3_anos:
        origem: "A sua organização ou coletivo, desenvolve comprovadamente atividades no território há, no mínimo, 3 anos?"
        tipo: booleano
        descricao: Pelo menos três anos de atuação comprovada no território.
      criterio_vinculo_partidario:
        origem: "Sua organização ou coletivo possui algum vínculo com partidos políticos em todo o território nacional ou seus responsáveis exercem cargos políticos?"
        tipo: booleano
        descricao: >-
          Vínculo partidário ou cargo político. "Sim" é critério de EXCLUSÃO.
      criterio_fins_religiosos:
        origem: "Sua organização social ou coletivo tem fins religiosos?"
        tipo: booleano
        descricao: Fins religiosos. "Sim" é critério de EXCLUSÃO.
      ciencia_comprovacao_receita:
        origem: "Declaro que estou ciente de que serão pedidas comprovações da receita anual."
        tipo: categoria
        descricao: Ciência de que a receita declarada será comprovada.

    regras:
      - tipo: minimo_linhas
        valor: 1
      - tipo: unico
        colunas: [id]
      - tipo: valores_permitidos
        coluna: status_credenciamento
        valores: [Aprovado automaticamente, Não aprovado]
      - tipo: valores_permitidos
        coluna: representa
        valores: [Associação sem fins lucrativos, Coletivo, Nenhuma das opções]
      - tipo: valores_permitidos
        coluna: criterio_dois_representantes
        valores:
          - Sim
          - Não
          - "Não se aplica, pois somos uma organização social (ONG, OSC)"
