# =============================================================================
# CONTRATO DE DADOS — Painel Redes Bahia
# =============================================================================
# Este arquivo é a ÚNICA fonte de verdade sobre a estrutura da planilha.
# Dele saem: a leitura do xlsm, as validações, o dicionário de dados
# (docs/03-dicionario-de-dados.md) e os metadados publicados para o painel.
#
# >>> ATENÇÃO: o schema abaixo é PROVISÓRIO. <<<
# Foi escrito antes do primeiro xlsm real chegar, apenas para o pipeline rodar
# de ponta a ponta. Quando o arquivo real entrar em data/raw/, rode:
#
#     make perfil
#
# ...que lê a planilha e gera um rascunho deste arquivo em
# reports/rascunho_fontes.yml + um relatório em reports/perfil_*.md.
# Compare, ajuste este arquivo e só então rode `make dados`.
#
# Tipos aceitos: texto | inteiro | decimal | data | booleano | categoria
# Regras aceitas: unico | valores_permitidos | intervalo | nao_nulo | minimo_linhas |
#                 referencia (chave estrangeira entre datasets)
# =============================================================================

versao: 1

fonte:
  diretorio: data/raw
  padrao_arquivo: "*.xlsm"
  # mais_recente = usa só o arquivo mais novo (por nome). É o modo do piloto:
  # a planilha do dia representa a foto completa da base naquele dia.
  selecao: mais_recente

publicacao:
  formatos: [csv, parquet, json]
  # Colunas marcadas como sensiveis nunca saem em data/published/ (ver LGPD em
  # docs/06-governanca-e-lgpd.md). Ficam apenas em data/processed/.
  remover_sensiveis: true
  # Limite de linhas por dataset no JSON do painel (0 = sem limite).
  limite_linhas_json: 0

# Histórico: a cada execução, grava contagens agregadas em
# data/published/historico.csv. É o que permite gráficos de evolução no tempo
# mesmo com a planilha sendo sempre uma foto do momento.
historico:
  arquivo: data/published/historico.csv
  agrupar_por: [status, territorio_identidade, eixo]

datasets:

  inscricoes:
    aba: Inscricoes
    descricao: >-
      Uma linha por proposta inscrita no edital. Grão: inscrição.
      Base para todos os indicadores de funil, território e valores.
    linha_cabecalho: 1
    chave: [id_inscricao]
    colunas:
      id_inscricao:
        origem: "ID Inscrição"
        tipo: texto
        obrigatorio: true
        descricao: Identificador único da proposta no sistema de inscrição.
      organizacao:
        origem: "Organização"
        tipo: texto
        obrigatorio: true
        descricao: Nome da organização proponente.
      cnpj:
        origem: "CNPJ"
        tipo: texto
        sensivel: true
        descricao: CNPJ da proponente. Dado de identificação — não publicado.
      email_contato:
        origem: "E-mail de Contato"
        tipo: texto
        sensivel: true
        descricao: Contato da proponente. Dado pessoal — não publicado.
      municipio:
        origem: "Município"
        tipo: categoria
        obrigatorio: true
        descricao: Município-sede da organização.
      territorio_identidade:
        origem: "Território de Identidade"
        tipo: categoria
        obrigatorio: true
        descricao: Um dos 27 Territórios de Identidade da Bahia.
      eixo:
        origem: "Eixo"
        tipo: categoria
        descricao: Eixo temático da proposta.
      etapa:
        origem: "Etapa"
        tipo: categoria
        descricao: Etapa do processo em que a proposta se encontra.
      status:
        origem: "Status"
        tipo: categoria
        obrigatorio: true
        descricao: Situação atual da proposta.
      data_inscricao:
        origem: "Data de Inscrição"
        tipo: data
        obrigatorio: true
        descricao: Data de envio da proposta.
      valor_solicitado:
        origem: "Valor Solicitado"
        tipo: decimal
        descricao: Valor pleiteado em reais.
      nota_final:
        origem: "Nota Final"
        tipo: decimal
        descricao: Nota consolidada da avaliação (0 a 10). Vazia até ser avaliada.
    regras:
      - tipo: minimo_linhas
        valor: 1
      - tipo: unico
        colunas: [id_inscricao]
      - tipo: valores_permitidos
        coluna: status
        valores: [Inscrita, Em análise, Habilitada, Inabilitada, Selecionada, Não selecionada, Desistente]
      - tipo: intervalo
        coluna: nota_final
        min: 0
        max: 10
      - tipo: intervalo
        coluna: valor_solicitado
        min: 0
      # Município escrito de forma diferente da tabela de apoio é a causa nº 1
      # de mapa com buraco. Vira aviso, não erro.
      - tipo: referencia
        coluna: municipio
        dataset: municipios
        coluna_alvo: municipio

  avaliacoes:
    aba: Avaliacoes
    descricao: >-
      Uma linha por nota atribuída. Grão: inscrição × avaliador × critério.
      Permite ver dispersão entre avaliadores e desempenho por critério.
    linha_cabecalho: 1
    chave: [id_inscricao, avaliador, criterio]
    colunas:
      id_inscricao:
        origem: "ID Inscrição"
        tipo: texto
        obrigatorio: true
        descricao: Chave estrangeira para inscricoes.id_inscricao.
      avaliador:
        origem: "Avaliador"
        tipo: categoria
        obrigatorio: true
        descricao: Identificação do avaliador (código ou nome).
      criterio:
        origem: "Critério"
        tipo: categoria
        obrigatorio: true
        descricao: Critério avaliado, conforme edital.
      nota:
        origem: "Nota"
        tipo: decimal
        obrigatorio: true
        descricao: Nota do critério (0 a 10).
      data_avaliacao:
        origem: "Data da Avaliação"
        tipo: data
        descricao: Data em que a nota foi registrada.
    regras:
      - tipo: unico
        colunas: [id_inscricao, avaliador, criterio]
      - tipo: intervalo
        coluna: nota
        min: 0
        max: 10
      - tipo: referencia
        coluna: id_inscricao
        dataset: inscricoes
        coluna_alvo: id_inscricao

  municipios:
    aba: Municipios
    descricao: >-
      Tabela de apoio (dimensão). Grão: município. Usada para mapas,
      cobertura territorial e cálculos por habitante.
    linha_cabecalho: 1
    chave: [municipio]
    colunas:
      municipio:
        origem: "Município"
        tipo: texto
        obrigatorio: true
        descricao: Nome do município.
      codigo_ibge:
        origem: "Código IBGE"
        tipo: texto
        descricao: Código IBGE de 7 dígitos — chave para bases externas e mapas.
      territorio_identidade:
        origem: "Território de Identidade"
        tipo: categoria
        obrigatorio: true
        descricao: Território de Identidade ao qual o município pertence.
      populacao:
        origem: "População"
        tipo: inteiro
        descricao: População estimada (fonte IBGE).
    regras:
      - tipo: unico
        colunas: [municipio]
