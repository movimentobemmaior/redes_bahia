<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redes Bahia · Entrar no painel</title>
  <meta name="description" content="Acesso ao painel de acompanhamento do Edital Redes Bahia — Movimento Bem Maior.">
  <meta name="theme-color" content="#4f2d71">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234f2d71'/%3E%3Ccircle cx='8' cy='8' r='4.2' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fontes/raleway-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../design/tokens/tokens.css">
  <link rel="stylesheet" href="assets/painel.css">
</head>
<body class="pagina-entrada">
  <main class="entrada">
    <div class="entrada-marca">
      <img src="assets/marca/logo-movimento-bem-maior-branco.png"
           alt="Movimento Bem Maior" width="431" height="120">
    </div>

    <div class="entrada-caixa">
      <p class="sobretitulo">Edital Redes Bahia</p>
      <h1>Painel do edital</h1>
      <p class="entrada-texto">
        Acompanhamento das cinco etapas, da divulgação ao resultado. O acesso é
        do comitê do edital.
      </p>

      <form id="entrar" class="entrada-form" autocomplete="on">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username"
               required autocapitalize="none" spellcheck="false">

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <p id="aviso-entrada" class="entrada-aviso" role="alert" hidden></p>

        <button id="botao-entrar" type="submit" class="botao-primario">Entrar</button>
      </form>
    </div>

    <p class="entrada-rodape">
      Movimento Bem Maior · Redes Bahia<br>
      Perdeu a credencial? Fale com a coordenação do edital.
    </p>
  </main>

  <script type="module" src="assets/entrada.js"></script>
</body>
</html>
